[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
exec = { path = "crates/exec" }
probe = { path = "crates/probe" }
zapret = { path = "crates/zapret" }
zapret2 = { path = "crates/zapret2" }
tester = { path = "crates/tester" }
cli = { path = "crates/cli" }
router = { path = "crates/router" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
specta-typescript = "0.0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3.27"
toml = "1.1"
libc = "0.2"

tauri = { version = "2.12", features = ["specta", "tray-icon"] }
tauri-build = "2.7"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
