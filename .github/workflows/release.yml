# Push a tag like v0.7.0: tests, builds the app, CLI and Linux packages, and attaches them to a
# GitHub release together with the updater manifest (latest.json).
# Run by hand (Actions → release → Run workflow) to only test and build; the packages are artifacts.
#
# Required secrets (repo → Settings → Secrets and variables → Actions):
# - TAURI_SIGNING_PRIVATE_KEY: the contents of ~/.tauri/zapret-hub.key (updater signing key).
#   Without it even a manual run fails: the updater config demands signed bundles.
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: the key password; empty for the generated key.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # 22.04 runners retire in 2026; 24.04 is the oldest image left. Packages built here need a
    # glibc of at least the runner's (2.39).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri and WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace
      - run: npm run check
      - run: npm run test
      - name: Build and pack
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The first `version = "..."` line of the root Cargo.toml is [workspace.package]'s.
          version=$(grep -m1 '^version = "' Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')
          npm run tauri build
          cargo build --release -p cli
          # A clean portable archive: unpack anywhere, run ./zapret-hub.
          stage="dist/.stage-$version"
          mkdir -p "$stage"
          cp target/release/zapret-hub target/release/zapret-hub-cli "$stage/"
          cp README.md docs/cli.md "$stage/"
          cp src-tauri/icons/icon.png "$stage/zapret-hub.png"
          cp packaging/zapret-hub.desktop "$stage/"
          tar -czf dist/zapret-hub-linux-x86_64.tar.gz -C "$stage" .
          rm -rf "$stage"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: zapret-hub-linux
          path: |
            dist/*.tar.gz
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          # Normalized names: the bundle names may carry spaces, and GitHub would mangle them in
          # asset URLs that latest.json has to match.
          appimage=$(find target/release/bundle/appimage -name '*.AppImage' | head -n1)
          signed="dist/zapret-hub_${version}_amd64.AppImage"
          cp "$appimage" "$signed"
          cp "$appimage.sig" "$signed.sig"
          cp target/release/bundle/deb/*.deb "dist/zapret-hub_${version}_amd64.deb"
          # The updater manifest: the release notes are this version's section of CHANGELOG.md.
          notes=$(awk -v ver="$version" '/^## /{insec = ($2 == ver)} insec && !/^## /{print}' CHANGELOG.md)
          url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$signed")"
          jq -n --arg version "$version" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$url" --arg signature "$(cat "$signed.sig")" '{
            version: $version,
            notes: $notes,
            pub_date: $date,
            platforms: {"linux-x86_64": {signature: $signature, url: $url}}
          }' > dist/latest.json
          printf '%s\n' "$notes" > notes.md
          gh release create "${{ github.ref_name }}" \
            "$signed" "$signed.sig" "dist/zapret-hub_${version}_amd64.deb" \
            dist/zapret-hub-linux-x86_64.tar.gz dist/latest.json \
            --title "Zapret Hub $version" --notes-file notes.md
