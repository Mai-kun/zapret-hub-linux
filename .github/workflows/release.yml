# Push a tag like v0.7.0: tests, builds the app and CLI on Windows and attaches the zip to a GitHub release.
# Run by hand (Actions → release → Run workflow) to only test and build; the zip is then an artifact.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace --exclude zapret-hub
      - run: ./tools/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: zapret-hub
          path: dist/*.zip
      - name: Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = "dist/zapret-hub-$version.zip"
          if (-not (Test-Path $zip)) { throw "$zip not built: does the tag match Cargo.toml's version?" }
          # The release notes are this version's section of CHANGELOG.md.
          $notes = ((Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Where-Object { $_ -like "$version*" }) -replace "^$([regex]::Escape($version))\s*", ''
          Set-Content notes.md $notes
          gh release create "${{ github.ref_name }}" $zip --title "Zapret Hub $version" --notes-file notes.md
