[package]
name = "zapret-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Zapret Hub: a tray app that manages Flowseal zapret and tests its strategies."
# Two binaries: plain `cargo run`, which `tauri dev` calls, must pick the app.
default-run = "zapret-hub"

[lib]
name = "zapret_hub_lib"

# The app's own test harness would carry `requireAdministrator` and fail in a plain terminal
# (os error 740); its code has no tests, they live in the library.
[[bin]]
name = "zapret-hub"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
exec.workspace = true
cli.workspace = true
probe.workspace = true
router.workspace = true
tester.workspace = true
zapret.workspace = true
zapret2.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-specta.workspace = true
toml.workspace = true
windows = { workspace = true, features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-registry.workspace = true

[dev-dependencies]
tempfile.workspace = true
